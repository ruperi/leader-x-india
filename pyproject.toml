[project]
name = "leader-x-india"
version = "0.1.0"
description = "Explainable Indian stock discovery research engine foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pyarrow>=17,<19",
    "streamlit>=1.39,<2",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leader_x"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "data",
    "server.py",
    "screener.py",
    "tests/test_backend.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv]
default-groups = ["dev"]
